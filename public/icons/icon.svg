<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Glass Card -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" filter="url(#shadow)" />

  <!-- Rupee Symbol & Growth Graph -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rupee top bar -->
    <line x1="180" y1="170" x2="332" y2="170" />
    <!-- Rupee second bar -->
    <line x1="180" y1="220" x2="300" y2="220" />
    <!-- Rupee curve -->
    <path d="M 230 170 C 310 170, 310 270, 230 270" />
    <!-- Rupee diagonal leg -->
    <line x1="225" y1="270" x2="320" y2="370" />
    <!-- Rupee vertical stem -->
    <line x1="230" y1="170" x2="230" y2="270" />
  </g>

  <!-- Subtle upward arrow indicator -->
  <g fill="#34d399">
    <circle cx="370" cy="150" r="28" fill="#10b981" />
    <path d="M 370 134 L 382 154 L 358 154 Z" fill="#ffffff" />
  </g>
</svg>

